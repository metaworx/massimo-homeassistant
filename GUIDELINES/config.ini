# Configuration for the guidelines tooling. Tracked on purpose: every agent,
# script and generated document resolves its paths through these values.
#
# This is git config format, read with "git config --file". git is already a
# hard requirement here - the shared guidelines are a submodule - so the shell
# and PowerShell tools share one parser instead of each hand-rolling its own.
# Machine-specific values belong in config.local.ini, which is not tracked.

# Where the agent documents live, relative to the project root.
#
#   {{guidelines_root}} - this directory: the project's own fragments, plus the
#                         runtime messages/ and temp/ directories
#   {{shared_root}}     - the shared guidelines submodule
[guidelines]
	root = GUIDELINES
	shared = GUIDELINES/shared

	# An overlay: this directory a repository of its own, excluded from a
	# project that does not carry the guidelines, with shared/ as its
	# submodule. Set by "install.sh --overlay", which also writes [overlay]
	# below; COMMIT.md 7.3 has what changes.
	#overlay = true

# In an overlay, whose rules govern the project's own commits: "own" where it
# has rules of its own, "shared" where COMMIT.md applies to them. Unset reads
# as "own".
#
#   [overlay]
#   	commits = own

[project]
	# Substituted for {{project_name}} and {{project_acronym}} in every
	# generated document. An empty acronym falls back to the name.
	name = Massimo for Home Assistant
	acronym = massimo-ha

	# Languages this project is written in; each names a lang/<language>/
	# directory in the shared guidelines. Maintained by
	# tools/detect-languages.sh, and kept honest by its --check in CI.
	languages = python, json

	# Paths whose change obliges a CHANGELOG bullet, per COMMIT.md 5.
	# Each value is a git pathspec and the key repeats. Checked by
	# tools/changelog.sh check, and rendered into project/_CONTRACT.md by
	# tools/changelog.sh update-contract so the contract states the rule an
	# agent is held to rather than describing it in prose.
	#
	# An inclusion list by design: what a project ships is shorter and
	# changes less often than what it does not. A project that would rather
	# say what is exempt writes exclusions instead - ":!vendor/**" selects
	# everything but that path, and the two forms may be mixed. Either way a
	# staged path matching no rule at all is reported, so a directory nobody
	# has classified is surfaced instead of quietly passing.
	#
	# In a git pathspec "*" matches across "/": ":!packages/*/*.md" exempts
	# every .md at any depth below packages/, not the ones one level down.
	# A rule that stops at a directory takes glob magic, in which "*" stays
	# in one directory and "**" crosses: ":(exclude,glob)packages/*/*.md".
	shipped = custom_components/**
	shipped = hacs.json
	shipped = :!tests/**
	shipped = :!GUIDELINES/**
	shipped = :!*.md
	shipped = :!.gitignore
	shipped = :!.gitattributes
	shipped = :!.gitmodules
	shipped = :!LICENSE

	# The changelog those paths oblige, relative to the project root.
	# Empty means this project keeps none and the check does not run.
	#
	# A repository keeping one changelog per package repeats the key, and a
	# value may be a glob:
	#
	#   changelog = CHANGELOG.md
	#   changelog = packages/*/CHANGELOG.md
	#
	# A shipped path is then answered for by the nearest changelog whose
	# scope holds it - by default, the one in its own directory or above.
	changelog = CHANGELOG.md
[changelog "CHANGELOG.md"]
	fragments = required

# Settings for a changelog declared above, in a subsection named exactly as
# its declaration. It declares nothing by itself. Every key is optional:
#
#   [changelog "packages/*/CHANGELOG.md"]
#   	# The paths it answers for, as git pathspecs read from its own
#   	# directory; the key repeats. A sole changelog answers for the
#   	# whole project, one of several for its own directory.
#   	scope = .
#   	scope = :!tests/**
#   	# The prefix of its release tags; "v" unless set. Set empty where
#   	# its releases are tagged somewhere else - a package tagged on the
#   	# mirror its CI splits it to has no tag in this repository.
#   	tags =
#   	# A file beside it that states the release: a JSON one's top-level
#   	# "version", or an XML one's <version> under its root element, as in
#   	# a Nextcloud appinfo/info.xml. check reports it ahead of the newest
#   	# section (a bump without a cut) or behind it (a cut without a bump),
#   	# and cut writes it.
#   	manifest = composer.json
#   	# Whether a bullet is written as a file of its own in CHANGELOG.d/
#   	# beside it (COMMIT.md 5.5): optional, the default, or required -
#   	# then check --staged refuses a line added to its [Unreleased], so
#   	# that branches never edit the same lines. A sole changelog takes it
#   	# in a subsection named as declared: [changelog "CHANGELOG.md"].
#   	fragments = required

# What tools/detect-languages.sh counts. By default every tracked file but
# vendor/, node_modules/ and the rest its --help lists, and the guidelines.
# Every key is optional:
#
#   [languages]
#   	# Files counted or not, as git pathspecs; the key repeats. ":!" leaves
#   	# files out, a plain one brings back files the defaults left out, and
#   	# an exclusion always wins: these count a vendored library of the
#   	# project's own, without its tests, and not its examples.
#   	path = :!docs/examples/**
#   	path = vendor/acme/**
#   	path = :!vendor/acme/tests/**
#   	# A language detected and deliberately not declared; the key
#   	# repeats. --fix does not write it and --check does not ask for it.
#   	# Declaring it in project.languages as well is an error.
#   	ignore = json

# The shared files a project copies into its own tree, for scripts that run
# where the submodule is not - a deployed copy, a container image, a GitHub
# workflow. Copied and checked by tools/sync-vendor.sh, and by install.sh
# after it moves the pin. A {{project_<key>}} in a shared file is rendered
# from project.<key> above as it is copied, a - in the key written _ in the
# placeholder: "app-id = <id>" under [project] fills {{project_app_id}}, a
# Nextcloud app's id where a copied workflow names the directory the app is
# installed to; a key the file names and [project] lacks refuses the copy.
# Every key is optional:
#
#   [vendor]
#   	# A shared file and where it goes, as <shared path> <project path>;
#   	# the key repeats.
#   	file = lang/shell/tools/cli-v1.sh lib/cli-v1.sh
#   	file = lang/shell/tools/env-v1.sh lib/env-v1.sh
#   	# Where the record of the copies is kept: vendor.sources beside the
#   	# first file unless set.
#   	record = lib/vendor.sources

# How a commit's summary line opens (COMMIT.md 3.1). The three keys are
# independent of each other, and each unset reads as its first value:
#
#   format     legacy        [TASK(component)] headline
#              conventional  feat(component): headline
#   component  minimal       none, but a role's token: chore(release)
#              optional
#              required      every commit names one, but a release and a merge
#   keywords   legacy        TASK FIX SECURITY CLEANUP WIP UPDATE RELEASE MERGE
#              conventional  feat docs refactor perf test build ci revert fix
#                            style chore merge
#
#   [commit]
#   	format = conventional
#   	component = optional
#   	keywords = conventional

# The trailer an agent's commit ends with (COMMIT.md 3.3). Required, and left
# empty here on purpose: which one this project's agents write is your
# decision, and every agent commit is refused until it is made.
#
#   co-authored-by  Co-authored-by: <name> <email>
#   assisted-by     Assisted-by: AGENT_NAME:MODEL_VERSION, the tool and the
#                   exact model id - as Nextcloud asks
#   both            both of them
#   optional        either, both or neither
[commit]
	format = conventional
	component = required
	keywords = conventional
	attribution = assisted-by
[ci]
	untested = GUIDELINES/wip/**
	untested = GUIDELINES/project/**
	untested = AGENTS.md
	untested = GUIDELINES/README.md
	untested = CHANGELOG.md
	untested = CHANGELOG.d/**
	untested = LICENSE

# Paths no test reads, so that a change to them alone may skip the suite.
# tools/fingerprint.sh hashes every tracked file of a commit but these, and a
# CI gate that finds a commit's hash already tested runs nothing again
# (templates/CI.template.md 4). Git pathspecs, the key repeating, as
# project.shipped's. Unset, every path is tested.
#
# None may be shipped, and config.ini, which holds the list, may not be one:
# fingerprint.sh refuses either, and tools/check reports it. Rendered into
# project/_CONTRACT.md by tools/fingerprint.sh update-contract.
#
# [ci]
# 	untested = GUIDELINES/wip/**
# 	untested = CHANGELOG.md

# What to generate:  output = <target>: <fragment> + <fragment> ...
#
# The target is relative to the project root, the fragments to guidelines.root.
# Repeat the key for more outputs; a fragment may feed more than one -
# project/_CONTRACT.md appears in both, because what binds work in a project
# binds whoever is doing it, agent or not. The target of the output built from
# shared/_AGENTS.md is substituted for {{contract_path}}, which is how a
# generated CLAUDE.md names the contract.
[generate]
	output = AGENTS.md: shared/_AGENTS.md + project/_CONTRACT.md
	output = GUIDELINES/README.md: project/_README.md + project/_CONTRACT.md + shared/_README.md
