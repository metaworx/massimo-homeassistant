set_vacation:
  target:
    entity:
      integration: massimo
      domain: climate
  fields:
    temperature:
      required: true
      example: 16
      selector:
        number:
          min: 4.5
          max: 30.5
          step: 0.5
          unit_of_measurement: "°C"
    end:
      required: true
      example: "2026-12-24 18:00:00"
      selector:
        datetime:

get_program:
  target:
    entity:
      integration: massimo
      domain: climate

set_program:
  target:
    entity:
      integration: massimo
      domain: climate
  fields:
    program:
      required: true
      example: '{"monday": [{"temp": 17, "until": "07:00"}, {"temp": 21, "until": "22:00"}, {"temp": 17, "until": "24:00"}]}'
      selector:
        object:
    etag:
      required: false
      example: "p34dc3ccc8014803a"
      selector:
        text:

copy_program:
  target:
    entity:
      integration: massimo
      domain: climate
  fields:
    source:
      required: false
      selector:
        entity:
          integration: massimo
          domain: climate
    days:
      required: false
      selector:
        select:
          multiple: true
          translation_key: day
          options: [monday, tuesday, wednesday, thursday, friday, saturday, sunday]
    to_days:
      required: false
      selector:
        select:
          multiple: true
          translation_key: day
          options: [monday, tuesday, wednesday, thursday, friday, saturday, sunday]
