set_vacation:
  target:
    entity:
      integration: massimo
      domain: climate
  fields:
    temperature:
      required: true
      example: 16
      selector:
        number:
          min: 4.5
          max: 30.5
          step: 0.5
          unit_of_measurement: "°C"
    end:
      required: true
      example: "2026-12-24 18:00:00"
      selector:
        datetime:
