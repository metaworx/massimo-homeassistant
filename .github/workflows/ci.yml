# The integration's checks: Home Assistant's hassfest and HACS's
# validation, ruff, and the tests against a real Massimo server built from
# metaworx/massimo (main, or the ref given to a manual run; a version tag's
# run also against Massimo's newest release). A push of main or of a version
# tag that passes them all is released by release.yml: main as the channel
# devel, a tag as its version (CONTRIBUTING.md, "Releases and channels").
name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      massimo_ref:
        description: Massimo's branch, tag or commit to test against
        default: main

permissions:
  contents: read

jobs:
  hassfest:
    name: hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: home-assistant/actions/hassfest@86d4564712fa02543c808e3a693dd04f9d3f8361 # master of 2026-10-26

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@d556e736723344f83838d08488c983a15381059a # 22.5.0
        with:
          category: integration
          # No topics on the repository yet: they come with the first
          # release (AP Integration, Block 10).
          ignore: topics

  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - run: pip install ruff==0.17.4
      - run: ruff check custom_components tests tools
      - run: ruff format --check custom_components tests tools

  # Which Massimo the tests run against: main, or the ref of a manual run;
  # for a version tag also Massimo's newest version tag with a release, so
  # that a release here works with a Massimo one can install.
  massimo:
    name: Which Massimo
    runs-on: ubuntu-latest
    outputs:
      refs: ${{ steps.refs.outputs.refs }}
    steps:
      - id: refs
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ inputs.massimo_ref || 'main' }}
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: |
          refs="[\"$REF\"]"
          if [ "$IS_TAG" = true ]; then
            newest=$(gh release list -R metaworx/massimo --exclude-drafts --limit 50 --json tagName \
              --jq '[.[].tagName | select(startswith("v"))][0] // ""')
            if [ -z "$newest" ]; then
              echo "::error::Massimo has no release to test against."
              exit 1
            fi
            refs="[\"$REF\", \"$newest\"]"
          fi
          echo "refs=$refs" | tee -a "$GITHUB_OUTPUT"

  test:
    name: Tests against Massimo ${{ matrix.massimo }}
    needs: massimo
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        massimo: ${{ fromJSON(needs.massimo.outputs.refs) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: metaworx/massimo
          ref: ${{ matrix.massimo }}
          path: massimo
          submodules: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: massimo/go.mod
          cache-dependency-path: massimo/go.sum
      - name: Build massimo
        working-directory: massimo
        run: CGO_ENABLED=0 go build -o "$RUNNER_TEMP/massimo" ./cmd/massimo
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements_test.txt
      - run: pip install -r requirements_test.txt
      - name: pytest
        env:
          MASSIMO_REQUIRED: "1"
        run: MASSIMO_BIN="$RUNNER_TEMP/massimo" python -m pytest -v -rs

  # A push of main or of a version tag, every check passed: released.
  # secrets: inherit, or the called workflow sees no secret, not even its
  # environment's.
  release:
    name: Release
    needs: [hassfest, hacs, lint, test]
    if: github.event_name == 'push'
    permissions:
      contents: write
      id-token: write
      attestations: write
      pages: write
    uses: ./.github/workflows/release.yml
    secrets: inherit
